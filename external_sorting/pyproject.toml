[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "external_sorting"
version = "0.1.0"
description = "Professional external sorting library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "psutil>=5.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
extsort = "external_sorting.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/external_sorting"